[project]
name = "ocr-trial-tele"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch",
    "torchvision",
    "transformers==4.57.1",
    "accelerate",
    "pillow",
    "rich",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
