# 全部 hook 经 uv 调用项目环境里的工具，版本以 pyproject.toml / uv.lock 为唯一源，
# 不另外维护 pre-commit 自己的工具版本。
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: comment-lint
        name: comment lint
        entry: uv run python scripts/comment_lint.py
        language: system
        pass_filenames: false
        always_run: true
