<!--
  通途静态检验页（架构 §11 / 决策 8）。由 `tongtu.report_page` 从
  `tongtu/data/report_page/` 的模板生成，随产物包分发。

  === 红线（架构 §11、决策 8）===============================================
  本页**永不添加**任何需要服务端或 LLM 调用的功能。要交互阅读器、AI 问答、在线重译，
  那是文枢（wenshu）read path 的职责，不在通途另起炉灶。本页的全部能力边界是：
  读产物包里已有的文件，把它们画出来。

  === 自包含纪律 ===========================================================
  * 零外链：页面不发起任何跨域请求，CSS/JS 全部内联，PDF.js 作为 vendor 随包
    （`vendor/pdfjs/`）。可用 CSP `default-src 'self' 'unsafe-inline' data: blob:`
    自检——本页在该策略下功能完整。
  * file:// 双击可开：数据走 data-as-JS（`report-data.js` 定义 window.TONGTU_REPORT，
    内含 zh.pdf 的 base64），绕开 file:// 下 XHR/fetch 被拒的限制；http(s) 下则优先
    fetch 同目录的 zh.pdf，省掉 base64 的 33% 体积。两条加载路径都在 app.js 里。
  * PDF.js 的 worker 在 file:// 下无法用 new Worker(file://…) 构造（浏览器一律拒绝），
    故 file:// 时把 worker 脚本以 <script> 注入主线程（pdf.js 自带的 fake worker 通道），
    http(s) 下走真 worker。
-->
