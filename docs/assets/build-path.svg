<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900" role="img" aria-label="通途 build path 的 artifact 数据流：从 src 源码树经 flatten、precompile、mask、survey、chunk、translate、compile 到 export 组装 artifact package">
<title>通途 build path：artifact 数据流</title>
<style>
  text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }
  .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }

  /* 底色取 GitHub 页面底色，主题一致时看不出卡片边界；
     不一致时（系统与 GitHub 主题设置相反）退化为一张可读的卡片。 */
  .bg       { fill: #ffffff; }
  .box      { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1; }
  .split    { fill: none; stroke: #d1d9e0; stroke-width: 1; stroke-dasharray: 3 3; }
  .chip     { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1; }
  .par      { fill: none; stroke: #0550ae; stroke-width: 1; stroke-dasharray: 4 4; opacity: .7; }

  .t-title  { fill: #1f2328; font-size: 13.5px; }
  .t-sub    { fill: #59636e; font-size: 11px; }
  .t-chip   { fill: #1f2328; font-size: 11px; text-anchor: middle; }
  .t-legend { fill: #59636e; font-size: 11.5px; }
  .t-blocks { fill: #bc4c00; font-size: 11px; }
  .t-src    { fill: #1a7f37; font-size: 11px; }
  .t-base   { fill: #0550ae; font-size: 11px; }
  .t-cool   { fill: #0550ae; font-size: 11px; }

  .e-spine  { fill: none; stroke: #57606a; stroke-width: 1.6; }
  .e-blocks { fill: none; stroke: #bc4c00; stroke-width: 1.6; }
  .e-src    { fill: none; stroke: #1a7f37; stroke-width: 1.6; }
  .e-base   { fill: none; stroke: #0550ae; stroke-width: 1.6; stroke-dasharray: 5 4; }
  .m-spine  { fill: #57606a; }
  .m-blocks { fill: #bc4c00; }
  .m-src    { fill: #1a7f37; }
  .m-base   { fill: #0550ae; }

  @media (prefers-color-scheme: dark) {
    .bg       { fill: #0d1117; }
    .box      { fill: #151b23; stroke: #3d444d; }
    .split    { stroke: #3d444d; }
    .chip     { fill: #212830; stroke: #3d444d; }
    .par      { stroke: #79c0ff; }

    .t-title  { fill: #f0f6fc; }
    .t-sub    { fill: #9198a1; }
    .t-chip   { fill: #f0f6fc; }
    .t-legend { fill: #9198a1; }
    .t-blocks { fill: #f0883e; }
    .t-src    { fill: #56d364; }
    .t-base   { fill: #79c0ff; }
    .t-cool   { fill: #79c0ff; }

    .e-spine  { stroke: #8d96a0; }
    .e-blocks { stroke: #f0883e; }
    .e-src    { stroke: #56d364; }
    .e-base   { stroke: #79c0ff; }
    .m-spine  { fill: #8d96a0; }
    .m-blocks { fill: #f0883e; }
    .m-src    { fill: #56d364; }
    .m-base   { fill: #79c0ff; }
  }
</style>
<defs>
  <marker id="a-spine" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" class="m-spine"/>
  </marker>
  <marker id="a-blocks" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" class="m-blocks"/>
  </marker>
  <marker id="a-src" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" class="m-src"/>
  </marker>
  <marker id="a-base" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" class="m-base"/>
  </marker>
</defs>

<rect class="bg" x="0" y="0" width="800" height="900"/>

<!-- 跨阶段的长程依赖 -->
<polyline class="e-blocks" points="580,377 640,377 640,604 120,604 120,650" marker-end="url(#a-blocks)"/>
<polyline class="e-blocks" points="640,570 520,570 520,650" marker-end="url(#a-blocks)"/>
<polyline class="e-src" points="290,57 700,57 700,668 580,668" marker-end="url(#a-src)"/>
<polyline class="e-base" points="60,286 28,286 28,756 120,756 120,722" marker-end="url(#a-base)"/>

<!-- 主链 -->
<line class="e-spine" x1="175" y1="84" x2="175" y2="120" marker-end="url(#a-spine)"/>
<line class="e-spine" x1="175" y1="178" x2="175" y2="214" marker-end="url(#a-spine)"/>
<line class="e-spine" x1="175" y1="304" x2="175" y2="346" marker-end="url(#a-spine)"/>
<polyline class="e-spine" points="175,335 465,335 465,346" marker-end="url(#a-spine)"/>
<line class="e-spine" x1="175" y1="404" x2="175" y2="440" marker-end="url(#a-spine)"/>
<polyline class="e-spine" points="230,404 230,414 465,414 465,440" marker-end="url(#a-spine)"/>
<line class="e-spine" x1="175" y1="498" x2="175" y2="534" marker-end="url(#a-spine)"/>
<polyline class="e-spine" points="465,498 465,518 230,518 230,534" marker-end="url(#a-spine)"/>
<line class="e-spine" x1="175" y1="592" x2="175" y2="646" marker-end="url(#a-spine)"/>
<line class="e-spine" x1="230" y1="722" x2="230" y2="786" marker-end="url(#a-spine)"/>
<line class="e-spine" x1="465" y1="722" x2="465" y2="786" marker-end="url(#a-spine)"/>

<!-- survey 与 chunk 无数据依赖 -->
<rect class="par" x="48" y="432" width="544" height="76" rx="8"/>

<!-- 节点 -->
<rect class="box" x="60"  y="30"  width="230" height="54" rx="6"/>
<rect class="box" x="60"  y="124" width="230" height="54" rx="6"/>
<rect class="box" x="60"  y="218" width="230" height="86" rx="6"/>
<rect class="box" x="60"  y="350" width="230" height="54" rx="6"/>
<rect class="box" x="350" y="350" width="230" height="54" rx="6"/>
<rect class="box" x="60"  y="444" width="230" height="54" rx="6"/>
<rect class="box" x="350" y="444" width="230" height="54" rx="6"/>
<rect class="box" x="60"  y="538" width="230" height="54" rx="6"/>
<rect class="box" x="60"  y="650" width="230" height="72" rx="6"/>
<rect class="box" x="350" y="650" width="230" height="72" rx="6"/>
<rect class="box" x="60"  y="790" width="520" height="56" rx="6"/>
<line class="split" x1="60" y1="266" x2="290" y2="266"/>

<g class="t-title mono">
  <text x="76" y="53">src/</text>
  <text x="76" y="147">build/flat.tex</text>
  <text x="76" y="241">build/precompile.tex</text>
  <text x="76" y="373">build/masked.tex</text>
  <text x="366" y="373">blocks.json</text>
  <text x="76" y="467">build/chunks/*.tex</text>
  <text x="366" y="467">brief.json + glossary.json</text>
  <text x="76" y="561">译文 chunk + chunks.json</text>
  <text x="76" y="675">zh.tex + zh.pdf + zh.synctex.gz</text>
  <text x="366" y="675">figures/ + 元数据</text>
  <text x="76" y="815">out/ artifact package</text>
</g>
<g class="t-sub">
  <text x="76" y="71">e-print 源码树，fetch 写入后只读</text>
  <text x="76" y="165">latexpand 展开的单文件</text>
  <text x="76" y="259">保证 xelatex 编译通过的原文，下游输入</text>
  <text x="76" y="284">manifests/precompile.json 的基线数据：</text>
  <text x="76" y="298">页数 / overfull / 未定义引用 / missing character</text>
  <text x="76" y="391">只剩需要翻译的文本</text>
  <text x="366" y="391">摘出去的 block，逐字节保存</text>
  <text x="76" y="485">章节树优先分块</text>
  <text x="366" y="485">全篇共享上下文</text>
  <text x="76" y="579">chunks.json 是翻译记忆</text>
  <text x="76" y="695">build/zh-spans.json：chunk 在 zh.tex 的字符区间</text>
  <text x="366" y="695">位图原样带走，矢量转位图并保留原件</text>
  <text x="76" y="833">export 组装：anchors 合成、report 与 inspection page 生成</text>
</g>

<!-- 阶段名 -->
<rect class="chip" x="145" y="94"  width="60"  height="20" rx="10"/>
<rect class="chip" x="137" y="188" width="76"  height="20" rx="10"/>
<rect class="chip" x="151" y="312" width="48"  height="20" rx="10"/>
<rect class="chip" x="149" y="414" width="52"  height="20" rx="10"/>
<rect class="chip" x="323" y="404" width="54"  height="20" rx="10"/>
<rect class="chip" x="143" y="508" width="64"  height="20" rx="10"/>
<rect class="chip" x="296" y="508" width="112" height="20" rx="10"/>
<rect class="chip" x="145" y="616" width="60"  height="20" rx="10"/>
<g class="t-chip">
  <text x="175" y="108">flatten</text>
  <text x="175" y="202">precompile</text>
  <text x="175" y="326">mask</text>
  <text x="175" y="428">chunk</text>
  <text x="350" y="418">survey</text>
  <text x="175" y="522">translate</text>
  <text x="352" y="522">brief + 命中术语</text>
  <text x="175" y="630">compile</text>
</g>
<rect class="chip" x="418" y="423" width="162" height="18" rx="9"/>
<text class="t-cool" x="499" y="436" text-anchor="middle">survey 与 chunk 无数据依赖</text>

<!-- 边的说明 -->
<text class="t-blocks" x="380" y="598" text-anchor="middle">backfill：placeholder 换回原始 TeX</text>
<text class="t-blocks" x="512" y="564" text-anchor="end">图 block 与 caption 槽位</text>
<text class="t-src" x="708" y="400">src/ 图源</text>
<text class="t-base" x="135" y="752">基线数据供 compile 出口做增量比对，不是文件内容流</text>

<!-- 图例 -->
<line class="e-spine"  x1="20"  y1="874" x2="42"  y2="874"/>
<text class="t-legend" x="48"  y="878">主链</text>
<line class="e-blocks" x1="96"  y1="874" x2="118" y2="874"/>
<text class="t-legend" x="124" y="878">blocks.json 的长程消费</text>
<line class="e-src"    x1="294" y1="874" x2="316" y2="874"/>
<text class="t-legend" x="322" y="878">src/ 直接消费</text>
<line class="e-base"   x1="415" y1="874" x2="437" y2="874"/>
<text class="t-legend" x="443" y="878">precompile 基线数据</text>
</svg>
