<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 546" width="800" height="546" role="img" aria-label="脚本与 agent 的职责边界：脚本判断触发条件并拉起 agent，agent 在会话内自行行动，脚本读产物独立复验；下方列出六个 hook 各自的阶段、原语、触发条件与终审判据">
<title>脚本与 agent 的职责边界，以及六个 hook 的触发与终审判据</title>
<style>
  text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }
  .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }

  /* 底色取 GitHub 页面底色，主题一致时看不出卡片边界；
     不一致时（系统与 GitHub 主题设置相反）退化为一张可读的卡片。 */
  .bg        { fill: #ffffff; }
  .box       { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1; }
  .box-agent { fill: #ffffff; stroke: #bc4c00; stroke-width: 1; stroke-dasharray: 4 3; }
  .rule      { fill: none; stroke: #d1d9e0; stroke-width: 1; }
  .tag-ask   { fill: #f6f8fa; stroke: #0550ae; stroke-width: 1; }
  .tag-work  { fill: #f6f8fa; stroke: #bc4c00; stroke-width: 1; }

  .t-role       { fill: #59636e; font-size: 11px; }
  .t-role-agent { fill: #bc4c00; font-size: 11px; }
  .t-main       { fill: #1f2328; font-size: 13px; }
  .t-sub        { fill: #59636e; font-size: 11.5px; }
  .t-edge       { fill: #59636e; font-size: 10.5px; text-anchor: middle; }
  .t-th         { fill: #59636e; font-size: 11px; }
  .t-td         { fill: #1f2328; font-size: 11.5px; }
  .t-hook       { fill: #1f2328; font-size: 14px; }
  .t-ask        { fill: #0550ae; font-size: 11px; text-anchor: middle; }
  .t-work       { fill: #bc4c00; font-size: 11px; text-anchor: middle; }

  .edge      { fill: none; stroke: #57606a; stroke-width: 1.6; }
  .edge-back { fill: none; stroke: #57606a; stroke-width: 1.4; stroke-dasharray: 4 4; }
  .m-spine   { fill: #57606a; }

  @media (prefers-color-scheme: dark) {
    .bg        { fill: #0d1117; }
    .box       { fill: #151b23; stroke: #3d444d; }
    .box-agent { fill: #151b23; stroke: #f0883e; }
    .rule      { stroke: #3d444d; }
    .tag-ask   { fill: #212830; stroke: #79c0ff; }
    .tag-work  { fill: #212830; stroke: #f0883e; }

    .t-role       { fill: #9198a1; }
    .t-role-agent { fill: #f0883e; }
    .t-main       { fill: #f0f6fc; }
    .t-sub        { fill: #9198a1; }
    .t-edge       { fill: #9198a1; }
    .t-th         { fill: #9198a1; }
    .t-td         { fill: #f0f6fc; }
    .t-hook       { fill: #f0f6fc; }
    .t-ask        { fill: #79c0ff; }
    .t-work       { fill: #f0883e; }

    .edge      { stroke: #8d96a0; }
    .edge-back { stroke: #8d96a0; }
    .m-spine   { fill: #8d96a0; }
  }
</style>
<defs>
  <marker id="b-spine" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" class="m-spine"/>
  </marker>
</defs>

<rect class="bg" x="0" y="0" width="800" height="546"/>

<!-- 调用形状 -->
<rect class="box"       x="24"  y="52" width="200" height="86"  rx="6"/>
<rect class="box-agent" x="292" y="34" width="216" height="122" rx="6"/>
<rect class="box"       x="576" y="52" width="200" height="86"  rx="6"/>

<text class="t-role"       x="40"  y="40">脚本</text>
<text class="t-role-agent" x="308" y="24">agent 会话，控制流不移交</text>
<text class="t-role"       x="592" y="40">脚本</text>

<text class="t-main" x="42"  y="80">触发条件成立</text>
<text class="t-main" x="308" y="62">多轮、执行命令、联网</text>
<text class="t-main" x="594" y="80">读产物，独立复验</text>

<g class="t-sub">
  <text x="42"  y="100">缓存未命中 / 编译失败 /</text>
  <text x="42"  y="118">环境分类判定不出来</text>
  <text x="308" y="82">自行调用 tongtu validate</text>
  <text x="308" y="100">改到自己认为可以为止</text>
  <text x="308" y="128">返回 WorkOutcome，其中</text>
  <text x="308" y="146">stop_reason 不构成判据</text>
  <text x="594" y="100">通过则写入缓存并继续</text>
  <text x="594" y="118">不通过则回退原文或终止</text>
</g>

<line class="edge" x1="224" y1="95" x2="288" y2="95" marker-end="url(#b-spine)"/>
<line class="edge" x1="508" y1="95" x2="572" y2="95" marker-end="url(#b-spine)"/>
<text class="t-edge" x="256" y="88">拉起</text>
<text class="t-edge" x="540" y="88">退出</text>

<path class="edge-back" d="M 676 138 L 676 200 L 124 200 L 124 142" marker-end="url(#b-spine)"/>
<text class="t-edge" x="400" y="194">仍不通过时的处置由脚本决定，不再拉起同一个 hook</text>

<!-- 六个 hook -->
<line class="rule" x1="24" y1="232" x2="776" y2="232"/>

<g class="t-th">
  <text x="24"  y="270">hook</text>
  <text x="58"  y="270">阶段</text>
  <text x="146" y="270">原语</text>
  <text x="212" y="270">触发</text>
  <text x="388" y="270">脚本终审判据</text>
</g>
<line class="rule" x1="24" y1="280" x2="776" y2="280"/>

<text class="t-hook" x="24"  y="308">①</text>
<text class="t-td mono" x="58" y="308">flatten</text>
<rect class="tag-ask" x="146" y="295" width="40" height="18" rx="4"/>
<text class="t-ask mono" x="166" y="308">ask</text>
<text class="t-td" x="212" y="308">主文件歧义</text>
<text class="t-td" x="388" y="308">latexpand 出口的形式检查</text>
<line class="rule" x1="24" y1="320" x2="776" y2="320"/>

<text class="t-hook" x="24"  y="348">②</text>
<text class="t-td mono" x="58" y="348">precompile</text>
<rect class="tag-work" x="146" y="335" width="40" height="18" rx="4"/>
<text class="t-work mono" x="166" y="348">work</text>
<text class="t-td" x="212" y="348">首次编译失败</text>
<text class="t-td" x="388" y="348">脚本复验 latexmk 通过，仍不过则终止</text>
<line class="rule" x1="24" y1="360" x2="776" y2="360"/>

<text class="t-hook" x="24"  y="388">③</text>
<text class="t-td mono" x="58" y="388">mask</text>
<rect class="tag-ask" x="146" y="375" width="40" height="18" rx="4"/>
<text class="t-ask mono" x="166" y="388">ask</text>
<text class="t-td" x="212" y="388">枚举到未知环境名</text>
<text class="t-td" x="388" y="388">unmask 往返恒等，blocks.json 完整</text>
<line class="rule" x1="24" y1="400" x2="776" y2="400"/>

<text class="t-hook" x="24"  y="428">④</text>
<text class="t-td mono" x="58" y="428">survey</text>
<rect class="tag-ask" x="146" y="415" width="40" height="18" rx="4"/>
<text class="t-ask mono" x="166" y="428">ask</text>
<text class="t-td" x="212" y="428">固定调用一次</text>
<text class="t-td" x="388" y="428">brief.json 通过 artifact model，失败降级为骨架</text>
<line class="rule" x1="24" y1="440" x2="776" y2="440"/>

<text class="t-hook" x="24"  y="468">⑤</text>
<text class="t-td mono" x="58" y="468">translate</text>
<rect class="tag-work" x="146" y="455" width="40" height="18" rx="4"/>
<text class="t-work mono" x="166" y="468">work</text>
<text class="t-td" x="212" y="468">每 chunk 未命中缓存</text>
<text class="t-td" x="388" y="468">出口 validate 四层全绿，否则该 chunk 回退原文</text>
<line class="rule" x1="24" y1="480" x2="776" y2="480"/>

<text class="t-hook" x="24"  y="508">⑥</text>
<text class="t-td mono" x="58" y="508">compile</text>
<rect class="tag-work" x="146" y="495" width="40" height="18" rx="4"/>
<text class="t-work mono" x="166" y="508">work</text>
<text class="t-td" x="212" y="508">编译不过</text>
<text class="t-td" x="388" y="508">zh.pdf 非空，页数与基线相当，日志无 CJK missing glyph</text>
</svg>
