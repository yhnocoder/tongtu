[project]
name = "tongtu"
description = "基于 LaTeX 源码的 arXiv 论文英译中引擎"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]

dependencies = [
    "pydantic>=2.7",       # artifact model
    "typer>=0.12",         # CLI 命令面
    "rich>=13",            # 进度显示与 doctor 结果的人读输出
    "httpx>=0.27",         # fetch 下载
    "pypdfium2>=4.30",     # anchors 的 pdf-scan 来源
]

[project.scripts]
tongtu = "tongtu.cli:main"

[project.urls]
Homepage = "https://github.com/yhnocoder/tongtu"

[dependency-groups]
dev = [
    "hypothesis>=6",       # mask/unmask 往返恒等的性质测试，随机输入打词法状态机
    "pre-commit>=4.6.2",
    "pytest>=8",
    "ruff>=0.16.3",
    "syrupy>=4",           # golden-file 快照管理
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "tongtu/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["tongtu"]

# 随仓库分发的资产打进 wheel 的 `tongtu/data/`：中文字体（霞鹜文楷 Light/Medium，
# OFL-1.1，缺它则中文全是豆腐）与 prompt 资产（`skill/`，每个介入点一个标准 Skill
# 目录）。消费方随对应阶段重建接回。
[tool.hatch.build.targets.wheel.force-include]
"fonts" = "tongtu/data/fonts"
"skill" = "tongtu/data/skill"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# 行宽交给 ruff format 管代码结构；中文技术散文的注释/文档字符串/断言字符串经常
# 略超 120，逐处手工折行收益低于成本，故不选 E501。
ignore = ["E501"]
