# 措辞与命名 denylist。每条规则：pattern 为正则（按行匹配，统一 IGNORECASE，只影响
# ASCII），hint 为违例时给出的提示。pattern 用单引号字面串，正则不需要转义。
# 清单只增不删：新抓到的口癖加一条 [[rules]]；存量违例由 diction_baseline.json 记录。
# 纪律见 AGENTS.md「行文与命名纪律」，用法见 scripts/diction_lint.py。

# —— 比喻式命名与修辞化行文：说它是什么、做什么，不说它「像什么」 ——

[[rules]]
pattern = '关节'
hint = '比喻式命名：写「介入点」（架构 §3）或该机制的实名'

[[rules]]
pattern = '\bjoints?\b'
hint = '比喻式命名的标识符：不要新增；存量暂缓改名，由基线记录'

[[rules]]
pattern = '解毒剂'
hint = '修辞：直接写该机制防住了什么'

[[rules]]
pattern = '双保险'
hint = '修辞：写清楚两道检查各是什么'

[[rules]]
pattern = '化身'
hint = '修辞：直接写它是什么'

[[rules]]
pattern = '钥匙'
hint = '修辞：直接写该机制起什么作用'

[[rules]]
pattern = '粒度哲学'
hint = '冠名式修辞：写具体的粒度规则'

[[rules]]
pattern = '来一刀'
hint = '口语比喻：写具体动作（删除／拆分／裁剪）'

[[rules]]
pattern = '棘轮'
hint = '机械比喻：写「只许减少」「只拦新增」'

[[rules]]
pattern = '门禁'
hint = '比喻式命名：写具体检查项与阻断条件'

[[rules]]
pattern = '金字塔'
hint = '比喻：写具体的层级结构或占比关系'

[[rules]]
pattern = '常绿'
hint = '比喻：写「持续有效」「长期维护」'

[[rules]]
pattern = '标红'
hint = '比喻／口语：写「标记为失败」或具体标记方式'

[[rules]]
pattern = '纪律'
hint = '拟人化措辞：写具体规则要求，不用「纪律」拟人化机制'

# —— 口语衬词与轻佻语气：写动作本身 ——

[[rules]]
pattern = '顺手'
hint = '口语衬词：写「一并」「同时」'

[[rules]]
pattern = '抓手'
hint = '空泛词：写具体机制或依据'

[[rules]]
pattern = '探一眼'
hint = '口语：写「检查」'

[[rules]]
pattern = '真模型'
hint = '口语衬词「真」：写具体限定，不用「真」作强调'

[[rules]]
pattern = '真跑'
hint = '口语衬词：写「实际运行」「执行」'

[[rules]]
pattern = '记一笔'
hint = '口语：写「记录」'

[[rules]]
pattern = '促升'
hint = '空泛词：写具体提升的指标与幅度'

# —— 绝对化与夸张措辞：写具体条件，不做无根据的强调 ——

[[rules]]
pattern = '永远'
hint = '绝对化措辞：写具体条件或范围，不用「永远」类绝对化表述'

[[rules]]
pattern = '刻意'
hint = '修辞化措辞：直接写该选择的原因，不用「刻意」渲染'
