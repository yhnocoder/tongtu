name: papers

# 手动触发的多篇全流程翻译：每篇一个 matrix 作业，在参考镜像 :env 里从 fetch 跑到 compile，
# 整个论文目录上传为 artifact paper-<paper>，PDF 另传一份 pdf-<paper>；最后 report 作业读各篇
# manifest，把一张表写进 run 页面的 step summary，每行链接到该篇的两个 artifact。
# <paper> 是输入清单里的写法；论文目录名带版本号（例如 2412.19437v2），由 tongtu status --json 给出。
#
# CI 没有 Claude 凭据，[modes] 的 fast 与 smart 都用 pi 的 deepseek 服务商（model = "pi/deepseek/…"），
# pi 从环境变量 DEEPSEEK_API_KEY 读密钥，secret 在 environment `llm` 里。
# config.toml 由作业写：load_config 没有内置回退，tongtu setup 只写模板。
#
# 隔离边界是容器 + 一次性 runner。Actions 的非特权容器起不来 bwrap（#88），所以 agentrun 关掉沙箱
#（AGENTRUN_SANDBOX=off）。


on:
  workflow_dispatch:
    inputs:
      arxiv_ids:
        description: 空格分隔的论文清单；article / conference / revtex 指 examples/papers/ 的模板论文
        type: string
        default: article
      from:
        description: 非空时传 --from <stage>
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: papers
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      papers: ${{ steps.split.outputs.papers }}
    steps:
      - id: split
        env:
          ARXIV_IDS: ${{ inputs.arxiv_ids }}
        run: |
          papers=$(printf '%s\n' $ARXIV_IDS | jq -R . | jq -sc .)
          echo "papers=$papers" >> "$GITHUB_OUTPUT"
          echo "本次要跑的论文：$papers"

  run:
    name: Run ${{ matrix.paper }}
    needs: plan
    if: github.actor == 'yhnocoder'
    runs-on: ubuntu-latest
    container: ghcr.io/yhnocoder/tongtu:env
    environment: llm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        paper: ${{ fromJSON(needs.plan.outputs.papers) }}
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # runner 上下文在作业级 env 里不可用，配置目录与工作目录根改在这里导出。
      - name: Point config and work directories at the runner temp
        run: |
          echo "TONGTU_HOME=$RUNNER_TEMP/tongtu" >> "$GITHUB_ENV"

      # 镜像只管 TeX + Python 依赖 + 字体；agent 运行时与 agentrun 在这里装。带 agentrun 的 :env 推送后，
      # 下面三步可以删除。版本与 docker/Dockerfile 的 PI_VERSION、AGENTRUN_VERSION 相同。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pi
        run: npm install -g @earendil-works/pi-coding-agent@1.0.1
      - name: Install agentrun
        run: |
          curl -fL --retry 3 -o /usr/local/bin/agentrun \
            https://github.com/yhnocoder/agentrun/releases/download/v1.0.1/agentrun-1.0.1-linux-x86_64
          echo "d794dbe708bcbde2793082e9f72aa284b1c29f65c1a3f5ae27b933491dfdc3d9  /usr/local/bin/agentrun" | sha256sum -c -
          chmod +x /usr/local/bin/agentrun
          echo "AGENTRUN_SANDBOX=off" >> "$GITHUB_ENV"

      # 镜像里的 venv 只有依赖，项目本体由 checkout 提供，这里装进去。
      - run: uv sync --frozen

      - name: Write config.toml
        run: |
          mkdir -p "$TONGTU_HOME"
          cat > "$TONGTU_HOME/config.toml" <<'TOML'
          # CI 专用的超时：作业上限 30 分钟，每次会话 600 秒，会话超时要落在 manifest 而不是作业被杀；要涨一起涨。
          [modes]
          default = "smart"

          [modes.fast]
          model           = "pi/deepseek/deepseek-v4-pro"
          timeout_seconds = 600

          [modes.smart]
          model           = "pi/deepseek/deepseek-v4-pro"
          timeout_seconds = 600
          TOML

      - run: uv run tongtu doctor

      # 模板论文名映射到 examples/papers/ 下的目录。跑完后由 tongtu status --json 取论文目录（不带版本号的
      # arXiv 编号解析到本地最新的版本），写进 PAPER_WORKDIR 供上传步骤用；总时长与退出码写进该目录的 ci.json，
      # 供 report 作业读。
      - name: Run pipeline
        env:
          PAPER: ${{ matrix.paper }}
          FROM: ${{ inputs.from }}
        run: |
          target="$PAPER"
          if [ -d "examples/papers/$PAPER" ]; then target="examples/papers/$PAPER"; fi
          args=()
          if [ -n "$FROM" ]; then args+=(--from "$FROM"); fi
          start=$(date +%s)
          code=0
          uv run tongtu run "$target" "${args[@]}" || code=$?
          workdir=$(uv run tongtu status "$target" --json | uv run python -c 'import json, sys; print(json.load(sys.stdin)["workdir"])')
          echo "PAPER_WORKDIR=$workdir" >> "$GITHUB_ENV"
          mkdir -p "$workdir"
          printf '{"paper": "%s", "seconds": %d, "exit_code": %d}\n' "$PAPER" "$(( $(date +%s) - start ))" "$code" \
            > "$workdir/ci.json"
          cat "$workdir/ci.json"
          exit "$code"

      # 只给一个目录，artifact 根就是论文目录本身，report 作业按 paper-<paper>/build/manifests 读。
      - uses: actions/upload-artifact@v7
        if: always() && env.PAPER_WORKDIR != ''
        with:
          name: paper-${{ matrix.paper }}
          path: ${{ env.PAPER_WORKDIR }}
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: always() && env.PAPER_WORKDIR != ''
        with:
          name: pdf-${{ matrix.paper }}
          path: ${{ env.PAPER_WORKDIR }}/out/*.pdf
          if-no-files-found: ignore
          retention-days: 14

  report:
    name: Report
    needs: run
    if: always() && needs.run.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync
      - uses: actions/download-artifact@v8
        with:
          pattern: paper-*
          path: ${{ runner.temp }}/papers
      - name: Write step summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${{ runner.temp }}/papers"
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --paginate --jq '.artifacts[] | {name, id}' | jq -s . > "${{ runner.temp }}/artifacts.json"
          uv run python scripts/ci_summary.py "${{ runner.temp }}/papers" "${{ runner.temp }}/artifacts.json" \
            >> "$GITHUB_STEP_SUMMARY"
